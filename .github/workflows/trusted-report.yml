name: Report Payload Toolkit proof
on:
  workflow_run:
    workflows: [Verify Payload Toolkit]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # The reporter always comes from the default branch. Never checkout the PR.
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.repository.default_branch }}', persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24.21.0 }
      - run: node scripts/trusted-report.mjs
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
